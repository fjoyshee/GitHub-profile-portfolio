<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Boost HR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Nunito:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — the employee phone app on the left, a live "rules engine" trace + demo controls on the right; HR dashboard is a separate full-width view */
:root{
  --bg:#F3F2F8; --surface:#FFFFFF; --sunk:#F8F7FC; --ink:#2A2940; --muted:#6B6A84; --line:#E4E2EF;
  --teal:#6259B0; --teal-soft:#ECEAF8; --sage:#5E9A86; --sage-soft:#E3F1EB;
  --ember:#B85F42; --ember-soft:#FBECE5; --on-accent:#FFFFFF;
  --good:#3D8A6E; --good-soft:#E2F1EA; --warn:#9C6B1C; --warn-soft:#FAF1DE; --crit:#B04E66; --crit-soft:#F8E5EA;
  --glow1:#E5E1F8; --glow2:#DFF0E9; --phone:#2A2940; --shadow:0 12px 32px -18px rgba(42,41,64,.28);
  --f-display:"Fraunces",Georgia,"Hind Siliguri",serif;
  --f-body:"Nunito","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-bn:"Hind Siliguri","Nunito",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14132A; --surface:#1D1C37; --sunk:#18172F; --ink:#ECEAF8; --muted:#A4A2C2; --line:#302E50;
  --teal:#AEA6F5; --teal-soft:#2A2752; --sage:#8FCDB8; --sage-soft:#1B3330;
  --ember:#F2A88B; --ember-soft:#3B2630; --on-accent:#14132A;
  --good:#86D0B1; --good-soft:#173329; --warn:#E9C177; --warn-soft:#382D17; --crit:#F3A0B4; --crit-soft:#3D2131;
  --glow1:#25214D; --glow2:#142A2B; --phone:#05050C; --shadow:0 12px 32px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14132A; --surface:#1D1C37; --sunk:#18172F; --ink:#ECEAF8; --muted:#A4A2C2; --line:#302E50;
  --teal:#AEA6F5; --teal-soft:#2A2752; --sage:#8FCDB8; --sage-soft:#1B3330;
  --ember:#F2A88B; --ember-soft:#3B2630; --on-accent:#14132A;
  --good:#86D0B1; --good-soft:#173329; --warn:#E9C177; --warn-soft:#382D17; --crit:#F3A0B4; --crit-soft:#3D2131;
  --glow1:#25214D; --glow2:#142A2B; --phone:#05050C; --shadow:0 12px 32px -18px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 40px}
body.bn{font-family:var(--f-bn)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* top bar */
.top{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal) 0 55%,var(--ember) 55%)}
.brand b{font-family:var(--f-display);font-size:19px}
.brand span{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* employee workbench */
.bench{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.phone{background:var(--phone);border-radius:42px;padding:10px;box-shadow:0 30px 60px -30px rgba(10,30,28,.45);max-width:400px;width:100%;margin-inline:auto}
.screen{background:var(--bg);border-radius:33px;height:780px;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:460px){.phone{padding:0;border-radius:0;background:none;box-shadow:none}.screen{border-radius:20px;height:calc(100dvh - 120px);min-height:620px;border:1px solid var(--line)}}
.status{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:12px;font-weight:600}
.scroll{flex:1;overflow-y:auto;padding:8px 18px 18px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 10px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--teal)}

.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:6px}
.hello h1{font-size:25px;line-height:1.15}
.hello p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.streak{background:var(--ember-soft);color:var(--ember)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:18px}
.card .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.slider{display:grid;gap:4px;margin-top:14px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline}
.slider .row b{font-size:14.5px}
.slider .row span{font-size:13px;font-weight:700;color:var(--teal)}
.slider .row span.hot{color:var(--ember)}
.slider .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--teal-soft),var(--line))}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--teal);margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--teal);color:var(--on-accent);width:100%}
.btn.ember{background:var(--ember)}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}

.boost{background:var(--ink);color:var(--bg);border:0}
.boost .label{color:color-mix(in oklab,var(--bg) 65%,var(--ink))}
.boost h2{font-size:24px;margin:6px 0 4px}
.boost p{margin:0 0 12px;font-size:14px;opacity:.85}
.boost .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.boost .meta span{font-size:12px;font-weight:600;border:1px solid color-mix(in oklab,var(--bg) 35%,transparent);border-radius:999px;padding:3px 9px}
.why{font-size:12.5px;margin-top:10px;opacity:.8}
.why summary{cursor:pointer;font-weight:600}

.guard{border:1.5px solid var(--ember);background:var(--ember-soft)}
.guard h2{color:var(--ember);font-size:18px}
.guard p{margin:6px 0 12px;font-size:14px}
.sos{font-size:12.5px;color:var(--muted);margin-top:10px}

.timer{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:20px 16px}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:42px;font-weight:700}
.step{font-size:17px;font-weight:600;min-height:52px;max-width:30ch}
.stepcount{font-size:12.5px;color:var(--muted)}
.breath{animation:breathe 16s ease-in-out infinite}
@keyframes breathe{0%{r:38px}25%{r:72px}50%{r:72px}75%{r:38px}100%{r:38px}}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14.5px}
.item .tx span{font-size:12.5px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{font-family:var(--f-display);font-size:24px;display:block;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.days i{display:block;height:28px;border-radius:8px;background:var(--sunk);border:1px dashed var(--line);margin-bottom:3px}
.days i.on{background:var(--teal);border:0}
.days i.hi{background:var(--ember);border:0}

.sheet{position:absolute;inset:0;background:color-mix(in oklab,var(--ink) 40%,transparent);display:flex;align-items:flex-end;z-index:5}
.sheet .body{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:20px 18px 24px;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:600}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:9;white-space:nowrap}
.privacy{display:flex;gap:8px;font-size:12.5px;color:var(--muted);align-items:flex-start}
.privacy svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--teal)}

/* side panel */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:17px;margin-bottom:4px}
.panel p.d{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:65ch}
.trace{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tcell{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tcell .v{font-weight:700;font-size:15px;margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
.flow .n{padding:5px 10px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-weight:600;color:var(--muted)}
.flow .n.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.flow .n.alert{background:var(--ember-soft);border-color:var(--ember);color:var(--ember)}
.flow .arr{color:var(--muted)}
.rules{width:100%;border-collapse:collapse;font-size:13px}
.rules td,.rules th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rules th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rules tr.hit td{background:var(--teal-soft)}
.rules tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.tw{overflow-x:auto}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}

/* HR */
.hr{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hrhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.hrhead h1{font-size:30px}
.hrhead p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.kpi .tgt{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:99px}
.status-pill{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.s-good{background:color-mix(in oklab,var(--good) 16%,var(--surface));color:var(--good)}
.s-warn{background:color-mix(in oklab,var(--warn) 18%,var(--surface));color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.heat{border-collapse:separate;border-spacing:4px;width:100%;font-size:12.5px}
.heat th{font-weight:600;color:var(--muted);text-align:center;font-size:11.5px}
.heat th.tm{text-align:left;color:var(--ink);font-size:13px;white-space:nowrap;padding-right:6px}
.heat th.tm small{color:var(--muted);font-weight:500}
.heat td{height:34px;min-width:40px;border-radius:7px;text-align:center;font-weight:700;font-size:12px}
.heat td.hidden{background:repeating-linear-gradient(45deg,var(--sunk) 0 6px,var(--line) 6px 7px);color:var(--muted);font-weight:500}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend .g{width:140px;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--teal-soft),var(--ember))}
.trends{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.trends li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;font-size:14px;counter-increment:t}
.trends li::before{content:counter(t);font-family:var(--f-display);font-weight:700;color:var(--muted)}
.trends li small{display:block;color:var(--muted);font-size:12.5px}
.delta{font-weight:700;font-size:13px}
.up{color:var(--ember)} .down{color:var(--good)}
.never{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.never ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.phases,.never{grid-template-columns:minmax(0,1fr)}}
.phase{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--sunk)}
.phase.now{border-color:var(--teal);background:var(--teal-soft)}
.phase b{display:block;font-size:14px}
.phase span{font-size:12.5px;color:var(--muted)}
.guide{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px}
.gsec{scroll-margin-top:16px}
.gsec .no{font-family:var(--f-display);font-weight:700;color:var(--ember);font-size:13px;letter-spacing:.06em}
.gsec h3{font-size:20px;margin:2px 0 6px}
.gsec ul.g{margin:8px 0 0;padding-left:18px;font-size:14px;max-width:70ch;display:grid;gap:4px}
.scale{width:100%;border-collapse:collapse;font-size:13px}
.scale td,.scale th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.scale th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scale td.hot{color:var(--ember);font-weight:700}
.callout{border-left:3px solid var(--ember);background:var(--ember-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;margin-top:12px;max-width:75ch}
svg text{fill:var(--muted);font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- calm wellness layer ---- */
body{background:radial-gradient(900px 520px at 6% -8%,var(--glow1),transparent 70%),radial-gradient(800px 520px at 100% 0%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;line-height:1.55}
h1,h2,h3{font-weight:560;font-variation-settings:"SOFT" 100,"opsz" 48;letter-spacing:-.005em}
.top .brand{margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:600;font-variation-settings:"SOFT" 100}
.mark{border-radius:50%!important;background:radial-gradient(circle at 34% 30%,var(--surface) 0 8%,var(--teal-soft) 26%,var(--teal) 68%,var(--sage) 100%)!important;animation:orb 9s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.1)}}
.btn{border-radius:999px;color:var(--on-accent);transition:transform .15s ease,background-color .2s,box-shadow .2s}
.btn:not(:disabled):hover{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--teal) 70%,transparent)}
.btn:not(:disabled):active{transform:scale(.98)}
.card,.panel,.kpi,.rcard{border-radius:var(--r);border-color:color-mix(in oklab,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.seg{box-shadow:var(--shadow)}
.modebtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.modebtn svg{width:16px;height:16px;color:var(--teal)}
.toast{border-radius:999px!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true"></div><div><b>Daily Boost</b><br><span>HR dashboard · clickable prototype</span></div></div>
  <span class="chip mute">Signed in as HR admin · Northwind Fintech</span>
  <button class="modebtn" id="modebtn" type="button"></button>
</header>

  const C=2*Math.PI*88,m=Math.floor(tState.left/60),s=String(Math.floor(tState.left%60)).padStart(2,'0');

/* ---------- App guidelines ---------- */
function renderGuide(){
  const sec=(id,no,title,body)=>`<section class="panel gsec" id="${id}"><span class="no">${no}</span><h3>${title}</h3>${body}</section>`;
  const scaleRows=['energy','stress','sleep'].map(k=>`<tr><td><b>${T.en[k]}</b></td>${WORDS[k].en.map((w,i)=>{const v=i+1,hot=(k==='stress'&&v>=4)||(k!=='stress'&&v<=2);return `<td class="${hot?'hot':''}">${v} · ${w}</td>`}).join('')}</tr>`).join('');
  const cat=BOOSTS.map(b=>`<tr><td><b>${b.en}</b><br><span style="color:var(--muted)">${b.bn}</span></td><td>${b.cat}</td><td class="num">${b.min} min</td><td class="num">${b.steps.length}</td><td>${RULES.filter(r=>r.picks.includes(b.id)).map(r=>r.id).join(', ')}</td></tr>`).join('');
  $('#guide').innerHTML=`
  <div class="hrhead"><div><span class="label">Daily Boost · product rules v1 · owned by the clinical team</span><h1>App guidelines</h1><p>How the check-in is scored, how a Boost is picked, when the clinical guardrail fires, and what HR can see.</p></div></div>
  <nav class="toc" aria-label="Sections"><a href="#g-checkin">Check-in scale</a><a href="#g-live">Live trace</a><a href="#g-rules">Rule table</a><a href="#g-guard">Clinical guardrail</a><a href="#g-catalog">Boost catalog</a><a href="#g-privacy">Privacy</a><a href="#g-demo">Demo controls</a></nav>

  ${sec('g-checkin','1','Check-in scale',`<p class="d">Three sliders, 1 to 5, about 15 seconds. Values shown in orange count toward a risk day.</p>
    <div class="tw"><table class="scale"><tr><th>Slider</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>${scaleRows}</table></div>
    <ul class="g"><li>One check-in per day. Checking in again the same day replaces the earlier answer.</li><li>The Boost is picked the moment the check-in is submitted.</li><li>Answers are visible only to the employee.</li></ul>`)}

  ${sec('g-live','2',"How today's Boost was chosen",`<p class="d">Live trace for the current check-in in the Employee app. Clinicians own these rules; A/B tests tune the pick order.</p><div class="trace-out"></div>`)}

  ${sec('g-rules','3','Rule table',`<p class="d">Evaluated top to bottom; the first match wins. Within a rule, the first option is served unless it was yesterday's Boost. "Something else" moves to the next option.</p><div class="tw"><table class="rules" id="rules"></table></div>`)}

  ${sec('g-guard','4','Clinical guardrail',`<ul class="g">
     <li><b>Risk day:</b> Stress = 5, or Stress ≥ 4 with Sleep ≤ 2 or Energy ≤ 2.</li>
     <li><b>Trigger:</b> three risk days in a row. The run counts only consecutive check-ins; a missed day breaks it.</li>
     <li><b>What the employee sees:</b> a supportive card on Today and Support offering a free, confidential 30-minute counsellor session, plus the 999 emergency line.</li>
     <li><b>Not now:</b> hides the card for that day only. It returns the next day if the run continues.</li>
     <li><b>Resolved:</b> booking a session clears the offer for the next three days.</li></ul>
     <div class="callout">HR is never notified when the guardrail fires or a session is booked. Only the anonymised conversion rate (target 10–15%) appears on the dashboard.</div>`)}

  ${sec('g-catalog','5','Boost catalog',`<p class="d">Every Boost is 2 to 5 minutes, written in English and Bangla, and reviewed by a clinician before release.</p>
    <div class="tw"><table class="scale"><tr><th>Boost</th><th>Category</th><th>Length</th><th>Steps</th><th>Used by</th></tr>${cat}</table></div>`)}

  ${sec('g-privacy','6','Privacy and HR visibility',`<ul class="g"><li>HR sees team averages only, for groups of 10 or more people. Smaller groups are hidden.</li><li>HR never sees individual scores, who triggered the guardrail, or who booked a session.</li><li>AES-256 at rest, TLS 1.3 in transit, role-based access, in line with the Data Protection Act.</li></ul>`)}

  ${sec('g-demo','7','Demo controls',`<p class="d">For walkthroughs only; these sit beside the phone in the Employee app.</p>
    <ul class="g"><li><b>Next day:</b> moves the simulated date forward to build a streak.</li><li><b>Check in as high-risk:</b> submits Energy 2, Stress 5, Sleep 1.</li><li><b>Load rough patch:</b> two prior risk days, so one more high-risk check-in trips the guardrail.</li><li><b>Load normal week / Start fresh:</b> resets the sample history.</li></ul>
    <div style="margin-top:12px"><button class="btn small" id="v-emp2">Go to Employee app →</button></div>`)}`;
  renderTrace();
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id.startsWith('s-')){const k=id.slice(2);S.form[k]=+e.target.value;const w=$('#w-'+k);w.textContent=L(WORDS[k])[S.form[k]-1];
    w.classList.toggle('hot',(k==='stress'&&S.form[k]>=4)||(k!=='stress'&&S.form[k]<=2));renderTrace();save();}
  if(id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);}
});
function doCheckin(vals){
  const c=vals||{...S.form};
  const p=pick(c, entry(S.day-1)&&entry(S.day-1).boost);
  S.history=S.history.filter(h=>h.d!==S.day);
  S.history.push({d:S.day,...c,boost:p.boost,rule:p.rule.id,completed:false,skip:0});
  S.tab='today';
}
document.addEventListener('click',e=>{
  const el=e.target.closest('button'); if(!el) return;
  if(el.id==='v-emp'||el.id==='v-emp2'){S.view='employee';render();window.scrollTo(0,0);return;}
  if(el.id==='v-hr'){S.view='hr';render();return;}
  if(el.id==='v-guide'){S.view='guide';render();window.scrollTo(0,0);return;}
  if(el.id==='c-next'){stopTick();tState=null;sheet=null;S.day++;S.form={energy:3,stress:3,sleep:3};S.tab='today';render();toast(fmtDate(S.day));return;}
  if(el.id==='c-quickrisk'){stopTick();tState=null;S.form={energy:2,stress:5,sleep:1};doCheckin();render();return;}
  if(el.id==='c-rough'){stopTick();tState=null;sheet=null;S=seed('rough');S.form={energy:2,stress:4,sleep:2};render();toast('Rough patch loaded');return;}
  if(el.id==='c-normal'){stopTick();tState=null;sheet=null;S=seed('normal');render();toast('Normal week loaded');return;}
  if(el.id==='c-reset'){stopTick();tState=null;sheet=null;const l=S.lang;S=fresh();S.lang=l;render();return;}
  if(el.dataset.tab){S.tab=el.dataset.tab;render();$('#app').scrollTop=0;return;}
  if(el.dataset.cat){S.libCat=el.dataset.cat;render();return;}
  if(el.dataset.open){const it=ALL.find(x=>x.id===el.dataset.open);if(it.steps)startTimer(it,false);else{sheet={type:'article',id:it.id};render();}return;}
  if(el.dataset.rate){const it=tState.item;if(tState.daily){const en=todayEntry();if(en){en.completed=true;en.rating=el.dataset.rate;}}
    stopTick();tState=null;S.tab='today';render();toast(S.lang==='bn'?'দারুণ, সম্পন্ন!':'Nice work. Logged.');return;}
  if(el.dataset.f){sheet.f[el.dataset.f]=el.dataset.v;renderSheet();return;}
  if(el.dataset.cancel){const b=S.bookings.find(x=>x.id==el.dataset.cancel);b.cancelled=true;S.bookings=S.bookings.filter(x=>!x.cancelled);render();return;}
  const a=el.dataset.act;
  if(a==='guide'){S.view='guide';render();window.scrollTo(0,0);}
  else if(a==='lang'){S.lang=S.lang==='en'?'bn':'en';render();}
  else if(a==='checkin'){doCheckin();render();}
  else if(a==='start'){startTimer(B(todayEntry().boost),true);}
  else if(a==='swap'){const en=todayEntry();en.skip=(en.skip||0)+1;const p=pick(en,entry(S.day-1)&&entry(S.day-1).boost,en.skip);en.boost=p.boost;render();}
  else if(a==='pause'){tState.paused=!tState.paused;render();}
  else if(a==='finish'){tState.left=0;tState.feedback=true;render();}
  else if(a==='quit'){stopTick();tState=null;render();}
  else if(a==='book'){sheet={type:'book',f:{counsellor:COUNSELLORS[0],lang:S.lang==='bn'?'বাংলা':'English',format:'Video',slot:null}};render();}
  else if(a==='confirm'){S.bookings.push({id:Date.now(),madeOn:S.day,...sheet.f});sheet.done=true;render();}
  else if(a==='closesheet'){sheet=null;render();}
  else if(a==='dismiss'){S.dismissed=S.day;render();toast(S.lang==='bn'?'ঠিক আছে। সহায়তা ট্যাবে সবসময় পাবেন।':'Okay. It’s always in the Support tab.');}
});
const setClock=()=>{const c=$('#clock');if(c)c.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};
setInterval(setClock,15000);setClock();
render();
})();
</script>

b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('dailyboost-mode',n)}catch(e){}paint()});paint();})();
